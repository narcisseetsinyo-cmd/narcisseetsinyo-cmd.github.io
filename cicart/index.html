<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09132d">
<meta name="description" content="CIC'ART — gestion d'atelier de couture : clients, mesures, commandes, paiements et stock.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CIC'ART">
<link rel="modulepreload" href="app.js">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>CIC'ART</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout : barre latérale sur ordinateur, barre d'onglets en bas sur téléphone ; fond marine profond avec halo bleu, comme le site de référence. */
:root{
  --bg:#09132d; --bg-2:#0c1838; --surface:#0f1d44; --surface-2:#142553; --line:#22336a; --line-soft:#1a2a59;
  --fg:#eef3ff; --muted:#9ba9cc; --label:#9fc0f6;
  --blue:#3d7af5; --blue-soft:rgba(61,122,245,.16);
  --red:#d23c3c; --red-soft:rgba(210,60,60,.16);
  --green:#8cc152; --green-ink:#14260a; --green-soft:rgba(140,193,82,.16);
  --amber:#f0b44c; --amber-soft:rgba(240,180,76,.16);
  --f-display:"Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; --r-lg:20px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(900px 600px at 85% 75%, rgba(45,95,200,.28), transparent 60%),radial-gradient(700px 500px at 10% 0%, rgba(30,60,140,.25), transparent 60%);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* --- shell --- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;padding:24px 18px;border-right:1px solid var(--line-soft);background:rgba(8,16,40,.55);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:-.02em;color:#fff;flex:none}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--muted);font-weight:600}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{color:var(--fg);background:var(--surface)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--blue-soft);box-shadow:inset 0 0 0 1px rgba(61,122,245,.35)}
.nav button[aria-current="page"] svg{color:var(--blue)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.sync{display:inline-flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.sync.ok i{background:var(--green)}
main{min-width:0;padding-inline:clamp(16px,4vw,44px);padding-block:28px 60px}
.tabbar{display:none}

/* --- typography --- */
.eyebrow{display:flex;align-items:center;gap:14px;color:var(--label);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.eyebrow::before{content:"";width:34px;height:2px;background:var(--red);flex:none}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5vw,54px);line-height:1;letter-spacing:-.035em;margin:12px 0 6px;text-wrap:balance}
h1 em{font-style:normal;color:var(--blue)}
h2{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin:0}
h3{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--label);margin:0}
.lede{color:var(--muted);margin:0 0 24px;max-width:60ch}
.lede b{color:var(--fg);font-weight:600}
.muted{color:var(--muted)}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-head .lede{margin:0}

/* --- controls --- */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:14px;font-weight:700;background:var(--blue);color:#fff;box-shadow:0 8px 24px -10px rgba(61,122,245,.8);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--fg)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--label)}
.btn.green{background:var(--green);color:var(--green-ink);border-radius:999px;box-shadow:none}
.btn.danger{background:transparent;color:#ff8a8a;box-shadow:inset 0 0 0 1.5px rgba(210,60,60,.5)}
.btn.danger.arm{background:var(--red);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px}
.icon-btn{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:800;font-size:18px}
.icon-btn:hover{box-shadow:inset 0 0 0 1.5px var(--label)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--label);letter-spacing:.06em;text-transform:uppercase}
.input,select.input,textarea.input{width:100%;background:var(--bg-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
.input:focus{border-color:var(--blue)}
textarea.input{min-height:76px;resize:vertical}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{all:unset;cursor:pointer;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line-soft);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.chip .n{opacity:.7;margin-left:4px}

/* --- panels --- */
.panel{background:linear-gradient(180deg,rgba(20,37,83,.72),rgba(15,29,68,.72));border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:20px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.grid-dash{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-12{grid-column:span 12}.span-6{grid-column:span 6}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi{padding:18px 20px;border-radius:var(--r-lg);border:1px solid var(--line-soft);background:rgba(12,24,56,.6);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:12px;font-weight:700;color:var(--label);letter-spacing:.1em;text-transform:uppercase}
.kpi strong{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,2.6vw,32px);letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.hero{background:var(--blue);border-color:transparent;box-shadow:0 18px 40px -20px rgba(61,122,245,.9)}
.kpi.hero span,.kpi.hero small{color:rgba(255,255,255,.82)}

/* lists */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line-soft);cursor:pointer;border-radius:10px}
.row:first-child{border-top:0}
.row:hover{background:rgba(61,122,245,.06)}
.row .who{min-width:0}
.row .who b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-tile{width:48px;text-align:center;border-radius:12px;padding:5px 0;background:var(--surface-2);line-height:1.1}
.date-tile b{display:block;font-family:var(--f-display);font-size:19px;font-weight:800}
.date-tile small{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--label);letter-spacing:.08em}
.date-tile.late{background:var(--red-soft)} .date-tile.late small{color:#ff9b9b}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);background:var(--surface-2);color:var(--label);flex:none}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-attente{color:#c3cbe0;background:rgba(155,169,204,.14)}
.s-coupe{color:#a9c6ff;background:var(--blue-soft)}
.s-couture{color:#7fa8ff;background:rgba(61,122,245,.24)}
.s-essayage{color:var(--amber);background:var(--amber-soft)}
.s-pret{color:var(--green);background:var(--green-soft)}
.s-livre{color:#7c8aad;background:rgba(124,138,173,.12)}
.tag-late{color:#ff9b9b;background:var(--red-soft)}
.tag-ex{color:var(--amber);background:var(--amber-soft);font-size:10.5px;padding:2px 7px;letter-spacing:.04em}
.tag-ex::before{display:none}

.progress{height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:inherit}

/* pipeline */
.pipeline{display:flex;flex-direction:column;gap:12px}
.pipe-row{display:grid;grid-template-columns:96px 1fr 30px;gap:12px;align-items:center;font-size:14px}
.pipe-row .bar{height:10px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.pipe-row .bar i{display:block;height:100%;border-radius:inherit;background:currentColor}
.pipe-row b{text-align:right;font-variant-numeric:tabular-nums}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .val{fill:var(--fg);font-weight:700}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--r-lg);background:rgba(12,24,56,.55)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--label);background:rgba(20,37,83,.5)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:rgba(61,122,245,.06)}
td.r,th.r{text-align:right}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.col{background:rgba(12,24,56,.55);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:160px}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.card:hover{border-color:var(--line)}
.card .t{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.card b{font-size:15px}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);gap:8px}

/* client cards */
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ccard{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r-lg);border:1px solid var(--line-soft);background:rgba(15,29,68,.7);cursor:pointer;min-width:0}
.ccard:hover{border-color:var(--line)}
.ccard .who{min-width:0;flex:1}
.ccard b{display:block}
.ccard small{display:block;color:var(--muted);font-size:13px}

/* stock */
.qty{display:inline-flex;align-items:center;gap:8px}
.qty b{min-width:52px;text-align:center;font-variant-numeric:tabular-nums}

/* drawer / modal */
.overlay{position:fixed;inset:0;background:rgba(3,8,22,.66);backdrop-filter:blur(4px);z-index:50;display:flex;justify-content:flex-end}
.sheet{width:min(560px,100%);height:100%;background:var(--bg-2);border-left:1px solid var(--line);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 22px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:20px;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head h2{font-size:26px;line-height:1.1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.mes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mes-grid .input{padding:8px 10px}
.mes-view{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);border-radius:14px;overflow:hidden;border:1px solid var(--line-soft)}
.mes-view div{background:var(--surface);padding:10px 12px}
.mes-view small{display:block;color:var(--muted);font-size:11.5px}
.mes-view b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.mes-view b span{font-size:11px;color:var(--muted);font-family:var(--f-body);font-weight:600;margin-left:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.money-box{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.money-box div{background:var(--surface);border-radius:14px;padding:12px}
.money-box small{display:block;color:var(--muted);font-size:12px}
.money-box b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:6px;border-radius:999px;background:var(--line-soft)}
.steps i.on{background:var(--blue)}
.steps i.done{background:var(--green)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r-lg)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:14px;background:var(--amber-soft);color:var(--amber);font-size:14px;margin-bottom:18px}
.banner p{margin:0}
.copybox{white-space:pre-wrap;background:var(--surface);border-radius:12px;padding:12px;font-size:13.5px;border:1px solid var(--line-soft)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.span-7,.span-5,.span-6{grid-column:span 12}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding-block:16px 110px}
  .mobile-top{display:flex!important}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(9,19,45,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line-soft);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px)}
  .tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
  .tabbar svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--fg)}
  .tabbar button[aria-current="page"] svg{color:var(--blue)}
  .form-grid{grid-template-columns:1fr}
  .mes-grid,.mes-view{grid-template-columns:repeat(2,1fr)}
  .money-box{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:480px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px}.money-box b{font-size:15px}}
.mobile-top{display:none;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
html{-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.side{padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
.sheet{padding-top:calc(env(safe-area-inset-top,0px) + 22px)}
.update{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:90;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--line);padding:12px 14px;border-radius:14px}
.install-tip{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--blue-soft);color:var(--label);font-size:14px;margin-bottom:18px}
.install-tip p{margin:0}

/* --- espace connecté --- */
.app.bare{grid-template-columns:1fr}
.app.bare .side,.app.bare .tabbar,.app.bare .mobile-top{display:none!important}
.auth{min-height:calc(100vh - 80px);display:grid;place-items:center;padding-block:24px}
.auth-card{width:min(440px,100%);display:flex;flex-direction:column;gap:18px}
.auth-card .brand b{font-size:26px}
.auth-card .panel{display:flex;flex-direction:column;gap:14px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.google{background:var(--fg);color:var(--bg);box-shadow:none}
.btn.block{width:100%;box-sizing:border-box}
.linkish{all:unset;cursor:pointer;color:var(--label);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.err{color:#ff9b9b;font-size:14px;margin:0}
.role{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--label)}
.role.admin{background:var(--red-soft);color:#ff9b9b}
.role.tailleur{background:var(--blue-soft);color:#a9c6ff}
.role.client{background:var(--green-soft);color:var(--green)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.08em;background:var(--surface);padding:4px 10px;border-radius:8px;border:1px solid var(--line)}
.order{display:flex;flex-direction:column;gap:14px}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.order-top h2{font-size:22px}
.steps-l{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:10.5px;color:var(--muted);text-align:center}
.steps-l span.on{color:var(--fg);font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.offline{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:85;background:var(--amber);color:#2a1a00;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px}
@media (max-width:820px){.steps-l{font-size:9.5px}}
</style>
</head>
<body>
<div class="app bare" id="app">
  <aside class="side">
    <div class="brand"><div class="mark">CA</div><div><b>CIC'ART</b><small id="sideSub">Gestion d'atelier</small></div></div>
